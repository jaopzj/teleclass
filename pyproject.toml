[project]
name = "teleaula"
version = "0.1.0"
description = "Plataforma pessoal para assistir cursos indexados em canais do Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36,<2",
    "cryptg>=0.4",  # criptografia do Telegram em C; sem ela o streaming fica ~100x mais lento
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tzdata>=2024.1",  # fusos horários no Windows (que não traz a base IANA)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
teleaula-index = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
